<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEAVE Framework | University of Westminster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#13235b;--text:#1f2a44;--muted:#56607a;--line:#dde2ee;--wash:#f2f4f9;--paper:#ffffff;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;color:var(--text);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 64px;}
  header .inst{margin:0 0 6px;font-size:1rem;font-weight:700;color:var(--muted);}
  h1{margin:0;font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.04;font-weight:800;letter-spacing:-0.02em;color:var(--ink);}
  header .lede{max-width:60ch;margin:14px 0 0;font-size:1.125rem;color:var(--muted);}
  .layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start;margin-top:36px;}
  .wheel-wrap{position:sticky;top:24px;}
  svg.wheel{display:block;width:100%;height:auto;overflow:visible;}
  .seg,.hub{cursor:pointer;}
  .seg{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s ease;}
  .seg .shape{stroke:var(--paper);stroke-width:4;}
  .seg text{fill:#fff;font-weight:800;font-size:20px;pointer-events:none;}
  .hub text{fill:#fff;font-weight:800;font-size:24px;pointer-events:none;}
  .wheel.dim .seg:not(.active){opacity:.72;}
  .seg .track{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round;}
  .seg .fill{fill:none;stroke-width:7;stroke-linecap:round;}
  .focus-ring{fill:none;stroke:var(--ink);stroke-width:4;pointer-events:none;opacity:0;}
  .focus-ring.on{opacity:1;}
  .hub circle.base{fill:var(--ink);transition:fill .2s;}
  .hub:hover circle.base{fill:#1c3280;}
  .hub .halo{fill:none;stroke:var(--ink);stroke-width:3;opacity:0;transition:opacity .2s;}
  .hub.active .halo{opacity:1;}
  .panel{border-top:6px solid var(--accent);padding-top:22px;}
  .panel[hidden]{display:none;}
  .panel.enter{animation:enter .28s ease;}
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .panel-head{display:flex;align-items:center;gap:14px;}
  .panel-head svg{width:40px;height:40px;flex:none;color:var(--accent);}
  .panel h2{margin:0;font-size:clamp(1.5rem,2.5vw,2rem);line-height:1.12;font-weight:800;letter-spacing:-0.01em;color:var(--accent);}
  .summary{margin:18px 0 0;font-size:1.2rem;line-height:1.45;max-width:44ch;}
  .kq{margin:14px 0 0;font-style:italic;color:var(--muted);max-width:48ch;}
  .howto{margin:16px 0 0;color:var(--muted);max-width:52ch;}
  .panel h3{margin:28px 0 8px;font-size:1rem;font-weight:700;color:var(--muted);}
  ul.checks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
  .checks li{border-bottom:1px solid var(--line);}
  .checks label{display:grid;grid-template-columns:26px 1fr;gap:14px;padding:14px 4px;cursor:pointer;align-items:start;font-size:1.05rem;}
  .checks label:hover{background:var(--wash);}
  .checks input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--accent);border-radius:6px;background:#fff;display:grid;place-content:center;cursor:pointer;}
  .checks input::before{content:"";width:13px;height:13px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);transform:scale(0);transition:transform .15s ease;}
  .checks input:checked{background:var(--accent);}
  .checks input:checked::before{transform:scale(1);}
  .checks input:checked+span{color:var(--muted);}
  ul.theme-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
  .theme-list li{border-bottom:1px solid var(--line);}
  .theme-list button{width:100%;display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;padding:13px 4px;border:0;background:none;font:inherit;font-size:1.05rem;color:var(--text);text-align:left;cursor:pointer;}
  .theme-list button:hover{background:var(--wash);}
  .theme-list .sw{width:14px;height:14px;border-radius:50%;background:var(--c);}
  .theme-list .ct{color:var(--muted);font-variant-numeric:tabular-nums;}
  .panel-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-top:22px;}
  .count{margin:0;color:var(--muted);font-variant-numeric:tabular-nums;}
  .nav{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{font:inherit;font-weight:700;font-size:.95rem;padding:8px 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--wash);}
  .btn.solid{background:var(--ink);color:#fff;}
  .btn.solid:hover{background:#1c3280;}
  @media(max-width:900px){.wrap{padding:28px 18px 48px;}.layout{grid-template-columns:1fr;gap:20px;margin-top:24px;}.wheel-wrap{position:static;width:100%;max-width:440px;margin:0 auto;}.summary{font-size:1.1rem;}}
  @media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important;}}
  @media print{.wheel-wrap,.nav,.howto{display:none!important;}.layout{display:block;margin-top:16px;}.panel,.panel[hidden]{display:block!important;break-inside:avoid;margin-bottom:20px;}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="15" height="17.5" rx="2"/><rect x="8.5" y="2" width="7" height="4" rx="1"/><path d="M8 12l2 2 4-4"/><path d="M8 17.5h8"/></symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <p class="inst">University of Westminster</p>
    <h1>WEAVE Curriculum Framework</h1>
    <p class="lede">The University of Westminster curriculum framework for designing high-quality, inclusive and future-focused courses and modules, aligned to the Education Strategy.</p>
  </header>
  <main class="layout">
    <div class="wheel-wrap">
      <svg class="wheel" id="wheel" viewBox="-282 -282 564 564" role="group" aria-label="WEAVE framework dimensions. Select a dimension to see its details."></svg>
    </div>
    <div id="panels" aria-live="polite"></div>
  </main>
</div>

<script>
const THEMES = [
  {
    id:"workbased",
    letter:"W",
    name:"Work-Based Learning",
    short:["Work-based","learning"],
    color:"#1553a5",
    summary:"Connect students to real workplace contexts, professional practice and employer partnerships throughout their course.",
    kq:"How does this curriculum connect students to work-based and professional learning experiences?",
    items:[
      "Integrate a minimum of 35 hours of work-based or placement learning across Levels 4 to 6.",
      "Design learning outcomes that connect academic study to workplace and community practice.",
      "Collaborate with employers and community partners to keep curriculum relevant and current.",
      "Use real-world tasks, professional technologies and industry-standard tools in assessment.",
      "Ensure inclusive and equitable access to placements and work-based opportunities."
    ]
  },
  {
    id:"equity",
    letter:"E",
    name:"Equity and Inclusion",
    short:["Equity","and inclusion"],
    color:"#543399",
    summary:"Design curricula where every student can participate, belong and succeed, free from barriers.",
    kq:"How does this curriculum enable all students to participate, belong and succeed?",
    items:[
      "Embed inclusive design principles using Universal Design for Learning across content, teaching and assessment.",
      "Use accessible and culturally responsive materials that meet digital accessibility standards.",
      "Represent diverse perspectives, identities and experiences across the curriculum.",
      "Co-create learning opportunities with students and communities where appropriate.",
      "Anticipate and actively mitigate barriers for under-represented student groups."
    ]
  },
  {
    id:"authentic",
    letter:"A",
    name:"Authentic Learning",
    short:["Authentic","learning"],
    color:"#c4500e",
    summary:"Ground learning in real, meaningful tasks and contexts that connect students to the wider world.",
    kq:"How does this curriculum engage students with authentic, real-world learning experiences?",
    items:[
      "Design assessments around genuine real-world tasks, problems and professional contexts.",
      "Use case studies, live projects and community challenges to make learning purposeful.",
      "Encourage students to apply knowledge critically in unfamiliar and complex situations.",
      "Integrate current research, practice and emerging technologies including digital and AI tools.",
      "Provide structured opportunities for students to reflect on and learn from experience."
    ]
  },
  {
    id:"values",
    letter:"V",
    name:"Values and Sustainability",
    short:["Values and","sustainability"],
    color:"#3c7a2a",
    summary:"Embed sustainability principles, ethical awareness and the UN Sustainable Development Goals across the curriculum.",
    kq:"How does this curriculum prepare students to act responsibly towards society and the planet?",
    items:[
      "Integrate Education for Sustainable Development and the UN SDGs within learning outcomes and content.",
      "Promote critical thinking about global, social and environmental challenges relevant to the discipline.",
      "Assess students on their understanding of sustainability in at least one module.",
      "Enable students to reflect on the ethical and social impact of their discipline and practice.",
      "Encourage sustainable practices in learning, teaching and assessment activities."
    ]
  },
  {
    id:"employability",
    letter:"E",
    name:"Employability and Graduate Attributes",
    short:["Employability","and graduate","attributes"],
    color:"#a06f05",
    summary:"Develop the skills, attributes and professional identity graduates need for their careers and for lifelong learning.",
    kq:"How does this curriculum build the capabilities and confidence graduates need for their futures?",
    items:[
      "Develop discipline-relevant professional skills and attributes alongside academic knowledge.",
      "Build critical thinking, effective communication, resilience and reflective practice.",
      "Embed enterprise, innovation and problem-solving across the curriculum.",
      "Connect assessment to professional standards and graduate-level expectations.",
      "Support students in developing a clear professional identity relevant to their field."
    ]
  }
];

const TOTAL=THEMES.reduce((n,t)=>n+t.items.length,0);
const state={active:-1,done:THEMES.map(t=>t.items.map(()=>false))};
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";
const R=244,r=92,HUB=84,PR=260,POP=12;
const n=THEMES.length,STEP=360/n;
const pt=(rad,deg)=>{const a=deg*Math.PI/180;return[rad*Math.cos(a),rad*Math.sin(a)];};
const f=v=>v.toFixed(2);
function sector(a0,a1){
  const[x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
  return`M${f(x0)} ${f(y0)}A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r} ${r} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function arc(rad,a0,a1){
  if(a1-a0<0.5)return"M0 0";
  const[x0,y0]=pt(rad,a0),[x1,y1]=pt(rad,a1);
  return`M${f(x0)} ${f(y0)}A${rad} ${rad} 0 ${a1-a0>180?1:0} 1 ${f(x1)} ${f(y1)}`;
}
const el=(tag,attrs={},parent)=>{
  const e=document.createElementNS(NS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
};

const wheel=document.getElementById("wheel");
const segLayer=el("g",{},wheel),ringLayer=el("g",{},wheel);
const segs=[],fills=[],rings=[];

THEMES.forEach((t,i)=>{
  const c=-90+STEP*i,a0=c-STEP/2,a1=c+STEP/2;
  const g=el("g",{class:"seg",tabindex:"0",role:"button","aria-label":t.name,"data-i":i},segLayer);
  el("path",{class:"shape",d:sector(a0,a1),fill:t.color},g);
  el("path",{class:"track",d:arc(PR,a0+3,a1-3)},g);
  fills.push(el("path",{class:"fill",d:"M0 0",stroke:t.color},g));
  const txt=el("text",{"text-anchor":"middle","aria-hidden":"true"},g);
  g._lines=t.short.map(line=>{const s=el("tspan",{},txt);s.textContent=line;return s;});
  g._c=c;
  rings.push(el("path",{class:"focus-ring",d:sector(a0,a1)},ringLayer));
  const[dx,dy]=pt(POP,c);g.dataset.dx=dx;g.dataset.dy=dy;
  segs.push(g);
});

const hub=el("g",{class:"hub",tabindex:"0",role:"button","aria-label":"About the WEAVE Framework"},wheel);
el("circle",{class:"halo",r:HUB+7},hub);
el("circle",{class:"base",r:HUB},hub);
const hubTxt=el("text",{"text-anchor":"middle","aria-hidden":"true"},hub);
const hs=el("tspan",{x:0,y:8},hubTxt);hs.textContent="WEAVE";
const hubRing=el("circle",{class:"focus-ring",r:HUB+7},wheel);

const isKeyboardFocus=node=>{try{return node.matches(":focus-visible");}catch(e){return true;}};
const compactMQ=window.matchMedia("(max-width:600px)");

function layoutLabels(){
  const compact=compactMQ.matches;
  const lh=compact?22:18,base=compact?7:5;
  // 5 segments at: W=-90, E=-18, A=54, V=126, E=198(-162)
  // A and V are lower half; W is top; nudge middle segments outward slightly
  const radAdj=[0, 10, 10, 10, 10];
  const yAdj  =[0,  6,  6,  6,  6];
  segs.forEach((g,i)=>{
    const nl=g._lines.length;
    const baseRad=compact?(nl>=3?174:162):(nl>=3?152:148);
    const rad=baseRad+(compact?0:radAdj[i]);
    const[lx,ly]=pt(rad,g._c);
    const yShift=compact?0:yAdj[i];
    g._lines.forEach((s,k)=>{
      s.setAttribute("x",f(lx));
      s.setAttribute("y",f(ly-(nl-1)*lh/2+k*lh+base+yShift));
    });
  });
  hs.setAttribute("y","8");
}
layoutLabels();
if(compactMQ.addEventListener)compactMQ.addEventListener("change",layoutLabels);
else if(compactMQ.addListener)compactMQ.addListener(layoutLabels);

const panels=document.getElementById("panels");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

let html=`<section class="panel" id="panel-overview" style="--accent:var(--ink)" aria-labelledby="h-overview">
  <div class="panel-head"><svg aria-hidden="true"><use href="#i-clip"/></svg><h2 id="h-overview">The WEAVE Framework</h2></div>
  <p class="summary">The WEAVE Framework sets out the five dimensions of curriculum design at the University of Westminster. Every course and module should address each dimension.</p>
  <p class="howto">Select a letter on the wheel or choose from the list below to see the principle and requirements for each dimension. Tick each requirement as your course design addresses it.</p>
  <h3>The five dimensions</h3>
  <ul class="theme-list">${THEMES.map((t,i)=>`<li><button type="button" data-go="${i}" style="--c:${t.color}"><span class="sw" aria-hidden="true"></span><span><strong>${t.letter}</strong> - ${esc(t.name)}</span><span class="ct" data-ct="${i}">0 of ${t.items.length}</span></button></li>`).join("")}</ul>
  <div class="panel-foot">
    <p class="count" id="total-count">0 of ${TOTAL} addressed</p>
    <div class="nav">
      <button type="button" class="btn" data-act="reset">Clear ticks</button>
      <button type="button" class="btn solid" data-act="print">Print</button>
    </div>
  </div>
</section>`;

THEMES.forEach((t,i)=>{
  html+=`<section class="panel" id="panel-${t.id}" style="--accent:${t.color}" aria-labelledby="h-${t.id}" hidden>
  <div class="panel-head"><svg aria-hidden="true"><use href="#i-clip"/></svg>
  <h2 id="h-${t.id}"><span style="font-size:1.4em;vertical-align:middle;margin-right:8px">${t.letter}</span>${esc(t.name)}</h2></div>
  <p class="summary">${t.summary}</p>
  <p class="kq">"${t.kq}"</p>
  <h3>Design requirements</h3>
  <ul class="checks">${t.items.map((it,k)=>`<li><label><input type="checkbox" data-t="${i}" data-k="${k}"><span>${esc(it)}</span></label></li>`).join("")}</ul>
  <div class="panel-foot">
    <p class="count" data-count="${i}">0 of ${t.items.length} addressed</p>
    <div class="nav">
      <button type="button" class="btn" data-act="overview">Overview</button>
      <button type="button" class="btn" data-act="prev">Previous</button>
      <button type="button" class="btn solid" data-act="next">Next</button>
    </div>
  </div>
</section>`;
});
panels.innerHTML=html;
const panelEls=[...panels.querySelectorAll(".panel")];

function select(i,opts={}){
  state.active=i;
  segs.forEach((g,k)=>{
    const on=k===i;
    g.classList.toggle("active",on);
    g.setAttribute("aria-pressed",on);
    g.style.transform=on?`translate(${g.dataset.dx}px,${g.dataset.dy}px)`:"";
  });
  wheel.classList.toggle("dim",i>=0);
  hub.classList.toggle("active",i<0);
  hub.setAttribute("aria-pressed",i<0);
  panelEls.forEach((p,k)=>{
    const show=k===i+1;p.hidden=!show;
    if(show&&!reduceMotion){p.classList.remove("enter");void p.offsetWidth;p.classList.add("enter");}
  });
  try{const hash=i<0?"":`#${THEMES[i].id}`;if(location.hash!==hash)history.replaceState(null,"",hash||location.pathname+location.search);}catch(e){}
  try{
    if(opts.scroll&&window.innerWidth<=900)panelEls[i+1].scrollIntoView({behavior:reduceMotion?"auto":"smooth",block:"start"});
    if(opts.focusHeading){const h=panelEls[i+1].querySelector("h2");h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}
  }catch(e){}
}

function updateProgress(){
  let total=0;
  THEMES.forEach((t,i)=>{
    const nv=state.done[i].filter(Boolean).length;total+=nv;
    const c=-90+STEP*i,a0=c-STEP/2+3,span=STEP-6;
    fills[i].setAttribute("d",nv?arc(PR,a0,a0+span*nv/t.items.length):"M0 0");
    segs[i].setAttribute("aria-label",`${t.name}, ${nv} of ${t.items.length} addressed`);
    panels.querySelector(`[data-count="${i}"]`).textContent=`${nv} of ${t.items.length} addressed`;
    panels.querySelector(`[data-ct="${i}"]`).textContent=`${nv} of ${t.items.length}`;
  });
  document.getElementById("total-count").textContent=`${total} of ${TOTAL} addressed`;
}

segs.forEach((g,i)=>{
  g.addEventListener("click",()=>select(i,{scroll:true}));
  g.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){e.preventDefault();select(i,{scroll:true,focusHeading:window.innerWidth<=900});}
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();segs[(i+1)%n].focus();}
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();segs[(i+n-1)%n].focus();}
  });
  g.addEventListener("focus",()=>{if(isKeyboardFocus(g))rings[i].classList.add("on");});
  g.addEventListener("blur",()=>rings[i].classList.remove("on"));
});
hub.addEventListener("click",()=>select(-1,{scroll:true}));
hub.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(-1);}});
hub.addEventListener("focus",()=>{if(isKeyboardFocus(hub))hubRing.classList.add("on");});
hub.addEventListener("blur",()=>hubRing.classList.remove("on"));

panels.addEventListener("change",e=>{
  const cb=e.target;
  if(cb.matches("input[type=checkbox]")){state.done[+cb.dataset.t][+cb.dataset.k]=cb.checked;updateProgress();}
});
panels.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){select(+go.dataset.go,{focusHeading:true});return;}
  const btn=e.target.closest("[data-act]");if(!btn)return;
  const a=btn.dataset.act,i=state.active;
  if(a==="next")select((i+1)%n,{focusHeading:true});
  if(a==="prev")select((i+n-1)%n,{focusHeading:true});
  if(a==="overview")select(-1,{focusHeading:true});
  if(a==="print")window.print();
  if(a==="reset"){
    state.done=THEMES.map(t=>t.items.map(()=>false));
    panels.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
    updateProgress();
  }
});
updateProgress();
select(THEMES.findIndex(t=>`#${t.id}`===location.hash));
</script>
</body>
</html>
