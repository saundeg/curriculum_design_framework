<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Design Framework | University of Westminster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13235b;
    --text: #1f2a44;
    --muted: #56607a;
    --line: #dde2ee;
    --wash: #f2f4f9;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--paper);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 64px; }

  header .inst { margin: 0 0 6px; font-size: 1rem; font-weight: 700; color: var(--muted); }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 4.6vw, 3.3rem);
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  header .lede { max-width: 60ch; margin: 14px 0 0; font-size: 1.125rem; color: var(--muted); }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: 56px;
    align-items: start;
    margin-top: 36px;
  }
  .wheel-wrap { position: sticky; top: 24px; }

  /* Wheel */
  svg.wheel { display: block; width: 100%; height: auto; overflow: visible; }
  .seg, .hub { cursor: pointer; }
  .seg { transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .25s ease; }
  .seg .shape { stroke: var(--paper); stroke-width: 4; }
  .seg text, .hub text { fill: #fff; font-weight: 800; font-size: 16px; pointer-events: none; }
  .seg use, .hub use { color: #fff; pointer-events: none; }
  .wheel.compact .seg use { display: none; }
  .wheel.compact .seg text { font-size: 21px; }
  .wheel.compact .hub text { font-size: 17px; }
  .wheel.dim .seg:not(.active) { opacity: .72; }
  .wheel.dim .seg:not(.active):hover { opacity: .85; }
  .seg .track { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; }
  .seg .fill { fill: none; stroke-width: 7; stroke-linecap: round; transition: d .3s ease; }
  .seg:focus, .hub:focus { outline: none; }
  .focus-ring { fill: none; stroke: var(--ink); stroke-width: 4; pointer-events: none; opacity: 0; }
  .focus-ring.on { opacity: 1; }
  .hub circle.base { fill: var(--ink); transition: fill .2s; }
  .hub:hover circle.base { fill: #1c3280; }
  .hub .halo { fill: none; stroke: var(--ink); stroke-width: 3; opacity: 0; transition: opacity .2s; }
  .hub.active .halo { opacity: 1; }

  /* Panels */
  .panel { border-top: 6px solid var(--accent); padding-top: 22px; }
  .panel[hidden] { display: none; }
  .panel.enter { animation: enter .28s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .panel-head { display: flex; align-items: center; gap: 14px; }
  .panel-head svg { width: 40px; height: 40px; flex: none; color: var(--accent); }
  .panel h2 {
    margin: 0;
    font-size: clamp(1.6rem, 2.6vw, 2.1rem);
    line-height: 1.12;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--accent);
  }
  .summary { margin: 18px 0 0; font-size: 1.25rem; line-height: 1.45; max-width: 42ch; }
  .howto { margin: 16px 0 0; color: var(--muted); max-width: 52ch; }
  .panel h3 { margin: 30px 0 8px; font-size: 1rem; font-weight: 700; color: var(--muted); }

  ul.checks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .checks li { border-bottom: 1px solid var(--line); }
  .checks label {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 14px;
    padding: 14px 4px;
    cursor: pointer;
    align-items: start;
    font-size: 1.05rem;
  }
  .checks label:hover { background: var(--wash); }
  .checks input {
    appearance: none;
    -webkit-appearance: none;
    width: 24px; height: 24px;
    margin: 1px 0 0;
    border: 2px solid var(--accent);
    border-radius: 6px;
    background: #fff;
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  .checks input::before {
    content: "";
    width: 13px; height: 13px;
    background: #fff;
    clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    transform: scale(0);
    transition: transform .15s ease;
  }
  .checks input:checked { background: var(--accent); }
  .checks input:checked::before { transform: scale(1); }
  .checks input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .checks input:checked + span { color: var(--muted); }

  ul.theme-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .theme-list li { border-bottom: 1px solid var(--line); }
  .theme-list button {
    width: 100%;
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 13px 4px;
    border: 0;
    background: none;
    font: inherit;
    font-size: 1.05rem;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }
  .theme-list button:hover { background: var(--wash); }
  .theme-list button:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .theme-list .sw { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
  .theme-list .ct { color: var(--muted); font-variant-numeric: tabular-nums; }

  .panel-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 16px;
    margin-top: 22px;
  }
  .count { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: .95rem;
    padding: 8px 16px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { background: var(--wash); }
  .btn.solid { background: var(--ink); color: #fff; }
  .btn.solid:hover { background: #1c3280; }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 900px) {
    .wrap { padding: 28px 18px 48px; }
    .layout { grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
    .wheel-wrap { position: static; width: 100%; max-width: 440px; margin: 0 auto; }
    .summary { font-size: 1.15rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; animation: none !important; }
  }

  @media print {
    .wheel-wrap, .nav, .howto, #panel-overview h3, #panel-overview .theme-list { display: none !important; }
    .layout { display: block; margin-top: 16px; }
    .panel, .panel[hidden] { display: block !important; break-inside: avoid; margin-bottom: 20px; }
    .checks input { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .panel { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<!-- Icon set -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-steps" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 20.5h5v-5h5v-5h5"/><path d="M17.5 10.5V3l4 2-4 2"/>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="13" r="8.5"/><circle cx="11" cy="13" r="4.5"/><path d="M11 13l9-9"/><path d="M17 4h3v3"/>
    </symbol>
    <symbol id="i-case" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8.5 7V5a1.5 1.5 0 0 1 1.5-1.5h4A1.5 1.5 0 0 1 15.5 5v2"/><path d="M2.5 12.5h19"/><path d="M12 11.5v2"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.5"/><ellipse cx="12" cy="12" rx="4" ry="9.5"/><path d="M2.5 12h19"/>
    </symbol>
    <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3.2"/><path d="M2.5 20.5c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.1c2.9.3 5 2.8 5 6"/>
    </symbol>
    <symbol id="i-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.5 9L12 4l10.5 5L12 14z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22.5 9v5.5"/>
    </symbol>
    <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="4" width="15" height="17.5" rx="2"/><rect x="8.5" y="2" width="7" height="4" rx="1"/><path d="M8 12l2 2 4-4"/><path d="M8 17.5h8"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header>
    <p class="inst">University of Westminster</p>
    <h1>Curriculum Design Framework</h1>
    <p class="lede">Principles and requirements for designing high-quality, inclusive and future-focused courses and modules, aligned to the University of Westminster Education Strategy.</p>
  </header>

  <main class="layout">
    <div class="wheel-wrap">
      <svg class="wheel" id="wheel" viewBox="-282 -282 564 564" role="group" aria-label="Framework themes. Select a theme to see its details."></svg>
    </div>
    <div id="panels" aria-live="polite"></div>
  </main>
</div>

<script>
const THEMES = [
  {
    id: "transitions", name: "Transitions Framework", short: ["Transitions"], icon: "i-steps", color: "#1553a5",
    summary: "Design courses that support students across their full journey, enabling successful transition and progression.",
    listTitle: "Requirements",
    items: [
      "Embed early transition support at pre-arrival and induction, including academic skills and clear expectations.",
      "Sequence learning and assessment to build confidence, skills and disciplinary identity.",
      "Provide structured opportunities for reflection and feedback to support progression through and between levels.",
      "Anticipate and respond to transition risks using data and proactive support.",
      "Prepare students for future pathways through employability, authentic learning approaches and professional identity development."
    ]
  },
  {
    id: "authentic", name: "Authentic Learning & Assessment", short: ["Authentic", "learning &", "assessment"], icon: "i-target", color: "#c4500e",
    summary: "Design learning and assessment that are authentic, challenging and aligned to real-world contexts.",
    listTitle: "Requirements",
    items: [
      "Align assessments with real-world tasks, professional practice and technologies where appropriate (e.g. AI).",
      "Ensure assessments are valid, reliable and inclusive by design.",
      "Provide opportunities for students to apply knowledge in authentic and meaningful ways.",
      "Use feedback formatively to support learning and improvement.",
      "Ensure academic integrity through clear design and student support and guidance on appropriate use of AI."
    ]
  },
  {
    id: "work-based", name: "Work-Based Learning", short: ["Work-based", "learning"], icon: "i-case", color: "#b81c2a",
    summary: "Embed work-based and placement learning to connect theory with practice and enhance employability.",
    listTitle: "Requirements",
    items: [
      "Integrate a minimum of 35 hours of work-based or placement learning in Levels 4–6.",
      "Design learning outcomes that connect academic learning to workplace practice.",
      "Assess work-based learning with clear criteria and alignment to module outcomes.",
      "Ensure inclusive access to placements and professional opportunities.",
      "Collaborate with employers to ensure relevance and quality."
    ]
  },
  {
    id: "sustainability", name: "Education for Sustainable Development", short: ["Sustainable", "development"], icon: "i-globe", color: "#3c7a2a",
    summary: "Embed sustainability principles and the UN Sustainable Development Goals across the curriculum.",
    listTitle: "Requirements",
    items: [
      "Integrate ESD and the SDGs explicitly within learning outcomes and content.",
      "Design learning experiences that promote critical thinking about global challenges.",
      "Assess students on their understanding of sustainability and their ability to act in at least one module.",
      "Promote sustainable practices in learning, teaching and assessment.",
      "Enable students to reflect on environmental, social and economic impacts."
    ]
  },
  {
    id: "edi", name: "Equity, Diversity & Inclusion", short: ["Equity,", "diversity &", "inclusion"], icon: "i-people", color: "#543399",
    summary: "Design inclusive courses that promote equity, celebrate diversity and remove barriers to success.",
    listTitle: "Requirements",
    items: [
      "Embed inclusive design principles in content, teaching and assessment, using principles of Universal Design for Learning.",
      "Use accessible and culturally responsive materials.",
      "Co-create learning where appropriate with students and communities.",
      "Represent diverse perspectives, identities and experiences across the curriculum.",
      "Anticipate and mitigate barriers for under-represented student groups."
    ]
  },
  {
    id: "graduate-attributes", name: "Graduate Attributes", short: ["Graduate", "attributes"], icon: "i-cap", color: "#a06f05",
    summary: "Design learning that develops the skills, mindsets and attributes our graduates need for life and work.",
    listTitle: "Attributes to develop",
    items: [
      "Develop critical and creative thinking.",
      "Foster effective communication and digital literacy.",
      "Build entrepreneurial mindset and resilience.",
      "Nurture global outlook and community engagement.",
      "Promote ethical, social and sustainable awareness and action."
    ]
  }
];

const COMMITMENT = "All course design decisions must be evidence-informed, aligned to University strategies and policies, and reviewed regularly in partnership with students, colleagues and external partners.";

const isKeyboardFocus = node => { try { return node.matches(":focus-visible"); } catch (e) { return true; } };
const TOTAL = THEMES.reduce((n, t) => n + t.items.length, 0);
const state = { active: -1, done: THEMES.map(t => t.items.map(() => false)) };
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Wheel geometry ---------- */
const NS = "http://www.w3.org/2000/svg";
const R = 244, r = 92, HUB = 84, PR = 260, POP = 12;
const pt = (rad, deg) => { const a = deg * Math.PI / 180; return [rad * Math.cos(a), rad * Math.sin(a)]; };
const f = n => n.toFixed(2);
function sector(a0, a1) {
  const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
  return `M${f(x0)} ${f(y0)}A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r} ${r} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function arc(rad, a0, a1) {
  if (a1 - a0 < 0.5) return "M0 0";
  const [x0, y0] = pt(rad, a0), [x1, y1] = pt(rad, a1);
  return `M${f(x0)} ${f(y0)}A${rad} ${rad} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f(x1)} ${f(y1)}`;
}
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

const wheel = document.getElementById("wheel");
const segLayer = el("g", {}, wheel);
const ringLayer = el("g", {}, wheel);
const segs = [], fills = [], rings = [];

THEMES.forEach((t, i) => {
  const c = -90 + 60 * i, a0 = c - 30, a1 = c + 30;
  const g = el("g", { class: "seg", tabindex: "0", role: "button", "aria-label": t.name, "data-i": i }, segLayer);
  el("path", { class: "shape", d: sector(a0, a1), fill: t.color }, g);
  el("path", { class: "track", d: arc(PR, a0 + 4, a1 - 4) }, g);
  fills.push(el("path", { class: "fill", d: "M0 0", stroke: t.color }, g));

  const [ix, iy] = pt(210, c);
  el("use", { href: "#" + t.icon, x: f(ix - 15), y: f(iy - 15), width: 30, height: 30 }, g);

  const txt = el("text", { "text-anchor": "middle", "aria-hidden": "true" }, g);
  g._lines = t.short.map(line => { const s = el("tspan", {}, txt); s.textContent = line; return s; });
  g._c = c;

  rings.push(el("path", { class: "focus-ring", d: sector(a0, a1) }, ringLayer));
  const [dx, dy] = pt(POP, c);
  g.dataset.dx = dx; g.dataset.dy = dy;
  segs.push(g);
});

const hub = el("g", { class: "hub", tabindex: "0", role: "button", "aria-label": "Our shared commitment and overview" }, wheel);
el("circle", { class: "halo", r: HUB + 7 }, hub);
el("circle", { class: "base", r: HUB }, hub);
el("use", { href: "#i-clip", x: -15, y: -40, width: 30, height: 30 }, hub);
const hubTxt = el("text", { "text-anchor": "middle", "aria-hidden": "true" }, hub);
["Our shared", "commitment"].forEach((line, k) => {
  const s = el("tspan", { x: 0, y: 12 + k * 17 }, hubTxt); s.textContent = line;
});
const hubRing = el("circle", { class: "focus-ring", r: HUB + 7 }, wheel);

/* Larger, icon-free labels on small screens so the wheel stays legible */
const compactMQ = window.matchMedia("(max-width: 600px)");
function layoutLabels() {
  const compact = compactMQ.matches;
  wheel.classList.toggle("compact", compact);
  const lh = compact ? 22 : 16, base = compact ? 7 : 5;
  segs.forEach(g => {
    const n = g._lines.length;
    const rad = compact ? (n === 3 ? 170 : 158) : (n === 3 ? 150 : 144);
    const [lx, ly] = pt(rad, g._c);
    g._lines.forEach((s, k) => {
      s.setAttribute("x", f(lx));
      s.setAttribute("y", f(ly - (n - 1) * lh / 2 + k * lh + base));
    });
  });
  const hs = hubTxt.querySelectorAll("tspan");
  hs.forEach((s, k) => s.setAttribute("y", compact ? 14 + k * 20 : 12 + k * 17));
}
layoutLabels();
if (compactMQ.addEventListener) compactMQ.addEventListener("change", layoutLabels);
else if (compactMQ.addListener) compactMQ.addListener(layoutLabels);

/* ---------- Panels ---------- */
const panels = document.getElementById("panels");
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

let html = `
<section class="panel" id="panel-overview" style="--accent:var(--ink)" aria-labelledby="h-overview">
  <div class="panel-head"><svg aria-hidden="true"><use href="#i-clip"/></svg><h2 id="h-overview">Our shared commitment</h2></div>
  <p class="summary">${COMMITMENT}</p>
  <p class="howto">Choose a theme on the wheel or from the list below to see its principle and requirements. Tick each one as your course or module design addresses it, and the ring around the wheel fills to show your progress.</p>
  <h3>The six themes</h3>
  <ul class="theme-list">
    ${THEMES.map((t, i) => `<li><button type="button" data-go="${i}" style="--c:${t.color}"><span class="sw" aria-hidden="true"></span><span>${esc(t.name)}</span><span class="ct" data-ct="${i}">0 of ${t.items.length}</span></button></li>`).join("")}
  </ul>
  <div class="panel-foot">
    <p class="count" id="total-count">0 of ${TOTAL} addressed</p>
    <div class="nav">
      <button type="button" class="btn" data-act="reset">Clear ticks</button>
      <button type="button" class="btn solid" data-act="print">Print framework</button>
    </div>
  </div>
</section>`;

THEMES.forEach((t, i) => {
  html += `
<section class="panel" id="panel-${t.id}" style="--accent:${t.color}" aria-labelledby="h-${t.id}" hidden>
  <div class="panel-head"><svg aria-hidden="true"><use href="#${t.icon}"/></svg><h2 id="h-${t.id}">${esc(t.name)}</h2></div>
  <p class="summary">${t.summary}</p>
  <h3>${t.listTitle}</h3>
  <ul class="checks">
    ${t.items.map((it, k) => `<li><label><input type="checkbox" data-t="${i}" data-k="${k}"><span>${esc(it)}</span></label></li>`).join("")}
  </ul>
  <div class="panel-foot">
    <p class="count" data-count="${i}">0 of ${t.items.length} addressed</p>
    <div class="nav">
      <button type="button" class="btn" data-act="overview">Overview</button>
      <button type="button" class="btn" data-act="prev">Previous theme</button>
      <button type="button" class="btn solid" data-act="next">Next theme</button>
    </div>
  </div>
</section>`;
});
panels.innerHTML = html;
const panelEls = [...panels.querySelectorAll(".panel")]; // [overview, ...themes]

/* ---------- State and rendering ---------- */
function select(i, opts = {}) {
  state.active = i;
  segs.forEach((g, k) => {
    const on = k === i;
    g.classList.toggle("active", on);
    g.setAttribute("aria-pressed", on);
    g.style.transform = on ? `translate(${g.dataset.dx}px, ${g.dataset.dy}px)` : "";
  });
  wheel.classList.toggle("dim", i >= 0);
  hub.classList.toggle("active", i < 0);
  hub.setAttribute("aria-pressed", i < 0);

  panelEls.forEach((p, k) => {
    const show = k === i + 1;
    p.hidden = !show;
    if (show && !reduceMotion) { p.classList.remove("enter"); void p.offsetWidth; p.classList.add("enter"); }
  });

  // Update the address so each theme has a shareable link. Some embedded
  // previews (sandboxed frames) block this, so it must never break the page.
  try {
    const hash = i < 0 ? "" : "#" + THEMES[i].id;
    if (location.hash !== hash) history.replaceState(null, "", hash || location.pathname + location.search);
  } catch (err) { /* address can't be changed here; ignore */ }

  try {
    if (opts.scroll && window.innerWidth <= 900) {
      panelEls[i + 1].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
    }
    if (opts.focusHeading) {
      const h = panelEls[i + 1].querySelector("h2");
      h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true });
    }
  } catch (err) { /* scrolling/focus is a nicety; ignore failures */ }
}

function updateProgress() {
  let total = 0;
  THEMES.forEach((t, i) => {
    const n = state.done[i].filter(Boolean).length;
    total += n;
    const c = -90 + 60 * i, a0 = c - 30 + 4, span = 52;
    fills[i].setAttribute("d", n ? arc(PR, a0, a0 + span * n / t.items.length) : "M0 0");
    segs[i].setAttribute("aria-label", `${t.name}, ${n} of ${t.items.length} addressed`);
    panels.querySelector(`[data-count="${i}"]`).textContent = `${n} of ${t.items.length} addressed`;
    panels.querySelector(`[data-ct="${i}"]`).textContent = `${n} of ${t.items.length}`;
  });
  document.getElementById("total-count").textContent = `${total} of ${TOTAL} addressed`;
}

/* ---------- Events ---------- */
segs.forEach((g, i) => {
  g.addEventListener("click", () => select(i, { scroll: true }));
  g.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, { scroll: true, focusHeading: window.innerWidth <= 900 }); }
    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); segs[(i + 1) % 6].focus(); }
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); segs[(i + 5) % 6].focus(); }
  });
  g.addEventListener("focus", () => { if (isKeyboardFocus(g)) rings[i].classList.add("on"); });
  g.addEventListener("blur", () => rings[i].classList.remove("on"));
});
hub.addEventListener("click", () => select(-1, { scroll: true }));
hub.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(-1); }
});
hub.addEventListener("focus", () => { if (isKeyboardFocus(hub)) hubRing.classList.add("on"); });
hub.addEventListener("blur", () => hubRing.classList.remove("on"));

panels.addEventListener("change", e => {
  const cb = e.target;
  if (cb.matches("input[type=checkbox]")) {
    state.done[+cb.dataset.t][+cb.dataset.k] = cb.checked;
    updateProgress();
  }
});

panels.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { select(+go.dataset.go, { focusHeading: true }); return; }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const a = btn.dataset.act, i = state.active;
  if (a === "next") select((i + 1) % 6, { focusHeading: true });
  if (a === "prev") select((i + 5) % 6, { focusHeading: true });
  if (a === "overview") select(-1, { focusHeading: true });
  if (a === "print") window.print();
  if (a === "reset") {
    state.done = THEMES.map(t => t.items.map(() => false));
    panels.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
    updateProgress();
  }
});

window.addEventListener("hashchange", () => {
  const i = THEMES.findIndex(t => "#" + t.id === location.hash);
  if (i !== state.active) select(i);
});

/* ---------- Start ---------- */
updateProgress();
select(THEMES.findIndex(t => "#" + t.id === location.hash));
</script>
